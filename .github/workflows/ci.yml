name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests (including AI bidding beta regression suite)
        run: bun run test

      - name: Check MCP SDK interoperability
        run: bun run test:mcp:clients

      - name: Build
        run: bun run build
