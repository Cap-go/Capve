name = "velo"
main = "worker/index.ts"
compatibility_date = "2025-08-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Tracking and API routes must hit the Worker even for browser navigations,
# otherwise SPA fallback serves index.html for /r, /c, /lp, /click and /mcp.
run_worker_first = ["/api/*", "/r/*", "/c/*", "/lp/*", "/click", "/click/*", "/mcp"]

[[d1_databases]]
binding = "DB"
database_name = "velo-db"
database_id = "eb916c67-6e45-4798-a6d9-c0e47f99cb8d"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

# Rate limits for /api/auth (login, register, forgot/reset password, verify email).
# namespace_id is any account-unique integer string; the Worker no-ops if a binding is missing.
[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "AUTH_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Scheduled jobs, dispatched by worker/cron/index.ts (CRON_JOBS keys must match).
# Every 15 min ("*/15 * * * *"): automation rules (zone blacklist, ROI/spend alerts).
# Hourly ("17 * * * *"): pull traffic source spend (Adcash, ...) into click costs.
# Daily ("17 3 * * *"): data retention — prunes the postback delivery log (30 days) and,
# only when RAW_CLICK_RETENTION_DAYS is set, raw clicks without conversions.
[triggers]
crons = ["*/15 * * * *", "17 * * * *", "17 3 * * *"]

[vars]
APP_URL = "http://localhost:5173"
AUTH_SECRET = "capve-local-dev-auth-secret-change-in-prod"
EMAIL_FROM = "noreply@capve.app"
PLATFORM_ADMIN_EMAILS = "martindonadieu@gmail.com"

[env.production]
# Keep worker name "velo" (wrangler defaults to velo-production otherwise).
name = "velo"
# AUTH_SECRET is a secret: bunx wrangler secret put AUTH_SECRET --env production
vars = { APP_URL = "https://capve.app", EMAIL_FROM = "noreply@capve.app", PLATFORM_ADMIN_EMAILS = "martindonadieu@gmail.com" }

[[env.production.send_email]]
name = "EMAIL"

[[env.production.ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "AUTH_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[env.production.triggers]
crons = ["*/15 * * * *", "17 * * * *", "17 3 * * *"]

# Custom domains for production.
# [env.production] are copied into dist/velo/wrangler.json only when the build
# sets CLOUDFLARE_ENV=production (see deploy workflow / package.json "deploy").
# Requires capve.app zone in the Cloudflare account for DNS to be provisioned.

[[env.production.routes]]
pattern = "capve.app"
custom_domain = true

[[env.production.routes]]
pattern = "www.capve.app"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "velo-db"
database_id = "eb916c67-6e45-4798-a6d9-c0e47f99cb8d"
migrations_dir = "migrations"
